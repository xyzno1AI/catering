<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多人贪吃蛇游戏</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>多人贪吃蛇游戏</h1>
        
        <div id="login-screen" class="screen">
            <div class="login-form">
                <h2>输入你的昵称</h2>
                <input type="text" id="player-name" placeholder="请输入昵称" maxlength="20">
                <button id="join-game">加入游戏</button>
            </div>
        </div>
        
        <div id="game-screen" class="screen hidden">
            <div class="game-info">
                <div class="scores">
                    <h3>玩家排行榜</h3>
                    <div id="scoreboard"></div>
                </div>
                <div class="controls">
                    <h3>控制说明</h3>
                    <p>使用 WASD 或方向键控制蛇的移动</p>
                    <p>吃到食物可以增长并得分</p>
                    <p>避免撞墙和其他蛇</p>
                </div>
            </div>
            
            <div class="game-area">
                <canvas id="game-canvas" width="800" height="600"></canvas>
            </div>
            
            <div class="game-status">
                <div id="connection-status">连接状态: 断开</div>
                <button id="leave-game">离开游戏</button>
            </div>
        </div>
    </div>
    
    <script src="/static/game.js"></script>
</body>
</html>
